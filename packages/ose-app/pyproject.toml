[build-system]
requires = ["setuptools >= 62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ose-app"
description = "Flask web application for OntoSpreadEd - Ontology spreadsheet editor"
requires-python = ">=3.13"
version = "1.4.2"

dependencies = [
    "ose-lib",
    "Flask==2.3.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Injector",
    "GitHub-Flask",
    "flask-cors==3.0.10",
    "Flask-Migrate",
    "networkx",
    "daff",
    "jsonschema",
    "openpyxl",
    "pyyaml",
    "requests",
    "whoosh3",
    "gitpython>=3.2.0",
    "pygithub>=2.10.0",
]

[project.entry-points.'ose.build_stages']
ose_app = "ose_app.release.stages"

[project.optional-dependencies]
cli = [
    "ose-cli",
]

[tool.uv.sources]
ose-cli = { workspace = true }
ose-lib = { workspace = true }
ose-plugin-addicto = { workspace = true }
ose-plugin-bcio = { workspace = true }
ose-plugin-hierarchical-spreadsheets = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ose_app = [
    "static/**/*",
    "database/migrations/alembic.ini",
    "database/migrations/script.py.mako",
    "database/migrations/README",
]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "types-flask-cors>=6.0.3.20260712",
    "types-flask-migrate",
]
