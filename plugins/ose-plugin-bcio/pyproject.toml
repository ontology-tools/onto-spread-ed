[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ose-plugin-bcio"
version = "2.0.0"
description = "Plugin for BCIO services and workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ose-lib==2.0.0",
    "ose-plugin-hbcp==2.0.0",
    "ose-app==2.0.0",
]

[project.entry-points.'ose.build_stages']
bcio = "ose_plugin_bcio.stages"

[project.entry-points.'ose.web_plugins']
"org.bssofoundry.bcio" = "ose_plugin_bcio.web:WEB_PLUGIN"

[project.entry-points.'ose.scripts']
bcio = "ose_plugin_bcio.scripts"

[tool.uv.sources]
ose-lib = { workspace = true }
ose-app = { workspace = true }
ose-plugin-hbcp = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ose_plugin_bcio = ["static/*"]
