[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ose-plugin-hierarchical-spreadsheets"
version = "1.4.2"
description = "OntoSpreadEd plugin for hierarchical spreadsheet generation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.6.1",
    "ose-lib==1.4.2",
    "scipy>=1.17.0",
]

[project.entry-points.'ose.build_stages']
hierarchical_spreadsheets = "ose_plugin_hierarchical_spreadsheets.stages"

[tool.uv.sources]
ose-lib = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

