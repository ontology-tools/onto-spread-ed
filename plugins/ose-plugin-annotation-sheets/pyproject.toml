[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ose-plugin-annotation-sheets"
version = "2.0.0"
description = "OntoSpreadEd plugin for generating annotation sheet templates"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.6.1",
    "openpyxl>=3.1.0",
    "ose-lib==2.0.0",
]

[project.entry-points.'ose.build_stages']
annotation_sheets = "ose_plugin_annotation_sheets.stages"

[tool.uv.sources]
ose-lib = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
