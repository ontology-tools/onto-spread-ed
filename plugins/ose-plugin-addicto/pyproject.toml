[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ose-plugin-addicto"
version = "2.0.0"
description = "OntoSpreadEd plugin for AddictO services and workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ose-lib==2.0.0",
    "ose-plugin-hbcp==2.0.0",
]

[project.entry-points.'ose.build_stages']
addicto = "ose_plugin_addicto.stages"

[project.entry-points.'ose.web_plugins']
"org.bssofoundry.addicto" = "ose_plugin_addicto.web:WEB_PLUGIN"

[tool.uv.sources]
ose-lib = { workspace = true }
ose-plugin-hbcp = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ose_plugin_addicto = ["static/*"]
